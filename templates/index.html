{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <!-- Hero Header -->
    <div class="text-center mb-5" data-aos="fade-down">
        <h1 class="fw-bold display-5 mb-3" data-ar="حمل الفيديوهات من أي منصة مجاناً" data-en="Download Videos From Any Platform Easily">
            حمل الفيديوهات من أي منصة مجاناً
        </h1>
        <p class="lead text-secondary-custom fs-6" data-ar="يدعم YouTube, TikTok, Instagram, Facebook, X والعديد من المنصات الأخرى." data-en="Supports YouTube, TikTok, Instagram, Facebook, X, and many more.">
            يدعم YouTube, TikTok, Instagram, Facebook, X والعديد من المنصات الأخرى.
        </p>
    </div>

    <!-- Input Form Section -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-9 col-lg-8" data-aos="zoom-in">
            <div class="card p-3 p-md-4 shadow-sm border-0">
                <form id="downloaderForm">
                    <div class="input-group input-group-lg">
                        <input type="url" id="videoUrl" class="form-control" placeholder="أدخل رابط الفيديو هنا..." required autocomplete="off">
                        <button class="btn btn-outline-secondary" type="button" id="pasteBtn" title="لصق">
                            <i class="fas fa-paste"></i>
                        </button>
                        <button class="btn btn-primary px-4" type="submit">
                            <i class="fas fa-search me-1"></i> <span data-ar="تحليل" data-en="Analyze">تحليل</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading State Spinner -->
    <div id="loadingSpinner" class="text-center my-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="mt-3 text-secondary-custom fw-bold" data-ar="جاري استخراج بيانات الفيديو..." data-en="Fetching video information...">
            جاري استخراج بيانات الفيديو...
        </p>
    </div>

    <!-- Progress Bar (Hidden by default) -->
    <div id="progressBarContainer" class="row justify-content-center my-3" style="display: none;">
        <div class="col-md-8">
            <div class="progress" style="height: 20px;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%;"></div>
            </div>
        </div>
    </div>

    <!-- Video Analysis Result Card -->
    <div id="resultSection" class="row justify-content-center my-4" style="display: none;" data-aos="fade-up">
        <div class="col-md-10 col-lg-8">
            <div class="card p-4">
                <div class="row g-4 align-items-center">
                    <div class="col-md-5 text-center">
                        <img id="videoThumbnail" src="" class="img-fluid rounded shadow-sm" alt="Thumbnail">
                    </div>
                    <div class="col-md-7">
                        <span id="videoPlatform" class="badge bg-danger mb-2">Platform</span>
                        <h4 id="videoTitle" class="fw-bold text-truncate mb-2">Video Title</h4>
                        <p class="mb-1 text-secondary-custom small">
                            <i class="fas fa-user me-1"></i> <span id="videoAuthor">Channel</span>
                        </p>
                        <p class="mb-3 text-secondary-custom small">
                            <i class="fas fa-clock me-1"></i> <span id="videoDuration">00:00</span>
                        </p>

                        <h6 class="fw-bold mb-2" data-ar="خيارات التنزيل المتاحة:" data-en="Available Download Options:">خيارات التنزيل المتاحة:</h6>
                        <div id="formatsContainer" class="d-flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supported Platforms Grid -->
    <div class="mt-5 text-center" data-aos="fade-up">
        <h5 class="fw-bold mb-4 text-secondary-custom" data-ar="المنصات المدعومة" data-en="Supported Platforms">المنصات المدعومة</h5>
        <div class="d-flex justify-content-center flex-wrap gap-3">
            <div class="platform-badge text-danger" title="YouTube"><i class="fab fa-youtube"></i></div>
            <div class="platform-badge text-dark" title="TikTok"><i class="fab fa-tiktok"></i></div>
            <div class="platform-badge text-warning" title="Instagram"><i class="fab fa-instagram"></i></div>
            <div class="platform-badge text-primary" title="Facebook"><i class="fab fa-facebook"></i></div>
            <div class="platform-badge text-info" title="X (Twitter)"><i class="fab fa-x-twitter"></i></div>
            <div class="platform-badge text-danger" title="Pinterest"><i class="fab fa-pinterest"></i></div>
            <div class="platform-badge text-info" title="Vimeo"><i class="fab fa-vimeo-v"></i></div>
            <div class="platform-badge text-primary" title="Dailymotion"><i class="fas fa-video"></i></div>
            <div class="platform-badge text-purple" title="Twitch"><i class="fab fa-twitch"></i></div>
            <div class="platform-badge text-warning" title="Reddit"><i class="fab fa-reddit"></i></div>
        </div>
    </div>
</div>
{% endblock %}
