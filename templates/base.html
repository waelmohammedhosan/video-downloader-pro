<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Video Downloader Pro - تنزيل الفيديوهات بسهولة{% endblock %}</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="أداة مجانية احترافية لتنزيل الفيديوهات من يوتيوب، تيك توك، إنستغرام، فيسبوك وتويتر بأعلى جودة وبكافة الصيغ.">
    <meta name="keywords" content="تنزيل فيديو, YouTube Downloader, TikTok Downloader, Instagram Reels, MP4, MP3">
    <meta name="author" content="Wael Mohammed">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Video Downloader Pro">
    <meta property="og:description" content="قم بتنزيل الفيديوهات والمقاطع الصوتية مجاناً برابط مباشر.">
    <meta property="og:image" content="/static/images/og-image.jpg">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Video Downloader Pro">
    <meta name="twitter:description" content="تنزيل جميع الفيديوهات من منصات التواصل بضغطة زر.">
    
    <!-- Favicon & Manifest -->
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">

    <!-- CSS Libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
<a class="navbar-brand d-flex align-items-center" href="/">
    <img src="/static/images/logo.png" alt="Video Downloader Pro" style="height: 40px; width: auto; object-fit: contain;">
</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'home' %}active fw-bold{% endif %}" href="/" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'about' %}active fw-bold{% endif %}" href="/about" data-ar="من نحن" data-en="About">من نحن</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'privacy' %}active fw-bold{% endif %}" href="/privacy" data-ar="سياسة الخصوصية" data-en="Privacy">سياسة الخصوصية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'terms' %}active fw-bold{% endif %}" href="/terms" data-ar="شروط الاستخدام" data-en="Terms">شروط الاستخدام</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'contact' %}active fw-bold{% endif %}" href="/contact" data-ar="اتصل بنا" data-en="Contact">اتصل بنا</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center gap-2">
                    <button id="langToggleBtn" class="btn btn-outline-secondary btn-sm">English</button>
                    <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm"><i class="fas fa-moon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Dynamic Container -->
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- Footer -->
    <footer class="footer py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-2 text-secondary-custom" data-ar="© 2026 Video Downloader Pro. جميع الحقوق محفوظة." data-en="© 2026 Video Downloader Pro. All rights reserved.">
                © 2027 Video Downloader Pro. جميع الحقوق محفوظة.
            </p>
<p class="small text-muted mb-2">
    <span data-ar="تم التطوير بواسطة" data-en="Developed by">
        تم التطوير بواسطة
    </span>

    <a href="/contact"
       class="text-decoration-none fw-bold d-inline-flex align-items-center gap-2">
        <img src="/static/images/syria.png"
             alt="Syria"
             width="22"
             height="16">

        <span> وائل محمد</span>
    </a>
</p>

<div class="d-flex justify-content-center flex-wrap gap-3 mt-3">

    <a href="mailto:hosanmohammedwael@gmail.com"
       class="text-decoration-none text-danger"
       title="Email">
        <i class="fas fa-envelope fa-lg"></i>
    </a>

    <a href="https://www.facebook.com/WaelMohammedlovewwwwayat/?locale=ar_AR"
       target="_blank"
       class="text-decoration-none text-primary"
       title="Facebook">
        <i class="fab fa-facebook fa-lg"></i>
    </a>

    <a href="https://instagram.com/wael_mohammed2002"
       target="_blank"
       class="text-decoration-none"
       style="color:#E1306C;"
       title="Instagram">
        <i class="fab fa-instagram fa-lg"></i>
    </a>

    <a href="https://t.me/waelmohammed2002sy"
       target="_blank"
       class="text-decoration-none text-info"
       title="Telegram">
        <i class="fab fa-telegram fa-lg"></i>
    </a>

</div>
    </footer>

    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
    </script>
</body>
</html>
